# monitor/network/compose.grafana.yml
volumes:
  grafana_data: {}

services:
  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: grafana
    profiles: [grafana,all]
    expose: ["${GRAFANA_PORT}"]
    environment:
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT}
    volumes:
    - type: volume
      source: grafana_data
      target: /var/lib/grafana
    env_file: .env

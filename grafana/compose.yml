# monitor/grafana/compose.grafana.yml
networks:
  monitor-net:
    driver: bridge

volumes:
  grafana_data: {}

services:
  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: grafana
    networks: [monitor-net]
    profiles: [grafana,all]
    ports: ["${GRAFANA_PORT}:3000"]
    volumes:
    - type: volume
      source: grafana_data
      target: /var/lib/grafana